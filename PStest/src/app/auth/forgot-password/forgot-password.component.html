<!-- ══════════════════════════════════════════════ -->
<!--  NexGen AI — Forgot Password Page             -->
<!-- ══════════════════════════════════════════════ -->

<div class="page-wrapper">

  <!-- ── Navbar ── -->
  <nav class="navbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <span class="brand-name">Nexus Peak</span>
        <span class="brand-sub">RECURIMENT SOLUTIONS</span>
      </div>
    </div>
  </nav>

  <!-- ── Grid background ── -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- ══════════════════════════════════════════════ -->
  <!--  Card                                          -->
  <!-- ══════════════════════════════════════════════ -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- ── STEP 1 : Enter email ── -->
      <ng-container *ngIf="!emailSent">

        <!-- Back button -->
        <button class="back-btn" (click)="goToLogin()" type="button">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
            <path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back to login
        </button>

        <!-- Header -->
        <div class="card-header">
          <div class="header-icon key-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1 class="card-title">Forgot password?</h1>
          <p class="card-subtitle">Enter your email and we'll send you a reset link</p>
        </div>

        <!-- Error banner -->
        <div class="error-banner server" *ngIf="errorMessage" role="alert">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="17" r="1" fill="currentColor"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Form -->
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate>

          <div class="field-group" [class.has-error]="emailError">
            <label class="field-label" for="email">Email address</label>
            <div class="field-input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="1.5"/>
                <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <input
                id="email"
                class="field-input"
                type="email"
                formControlName="email"
                placeholder="name@domain.com"
                autocomplete="email"
              />
            </div>
            <div class="field-error" *ngIf="emailError" role="alert">
              <svg viewBox="0 0 16 16" fill="none" width="14" height="14">
                <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
                <line x1="8" y1="5" x2="8" y2="8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="8" cy="11" r="0.75" fill="currentColor"/>
              </svg>
              {{ emailError }}
            </div>
          </div>

          <button type="submit" class="submit-btn" [class.loading]="isLoading" [disabled]="isLoading">
            <span class="btn-text" *ngIf="!isLoading">Send reset link</span>
            <span class="btn-spinner" *ngIf="isLoading">
              <span class="spinner"></span>
              Sending…
            </span>
          </button>

        </form>
      </ng-container>

      <!-- ── STEP 2 : Success state ── -->
      <ng-container *ngIf="emailSent">
        <div class="success-state">
          <div class="success-icon-wrap">
            <div class="success-ring"></div>
            <svg viewBox="0 0 24 24" fill="none" width="36" height="36">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="1.8"/>
              <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="17" cy="17" r="5" fill="var(--success)" stroke="var(--bg-card)" stroke-width="1.5"/>
              <path d="M14.5 17l1.5 1.5 2.5-2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="success-title">Check your inbox</h2>
          <p class="success-desc">
            We've sent a reset link to<br/>
            <strong class="success-email">{{ submittedEmail }}</strong>
          </p>
          <p class="success-hint">Link expires in <strong>10 minutes</strong>. Check your spam folder if you don't see it.</p>
          <button class="submit-btn" (click)="resend()" [class.loading]="isLoading" [disabled]="isLoading || resendCooldown > 0">
            <span class="btn-text" *ngIf="!isLoading && resendCooldown === 0">Resend email</span>
            <span class="btn-text" *ngIf="!isLoading && resendCooldown > 0">Resend in {{ resendCooldown }}s</span>
            <span class="btn-spinner" *ngIf="isLoading">
              <span class="spinner"></span>
              Sending…
            </span>
          </button>
          <button class="back-link-btn" (click)="goToLogin()">← Back to login</button>
        </div>
      </ng-container>

    </div>
  </div>
</div>

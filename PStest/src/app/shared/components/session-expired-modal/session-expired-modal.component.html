<!-- shared/session-expired-modal/session-expired-modal.component.html -->
<div class="overlay" *ngIf="visible" (click)="$event.stopPropagation()">
  <div class="modal">

    <div class="icon-ring">
      <svg class="lock-icon" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="11" width="14" height="10" rx="2"
              stroke="currentColor" stroke-width="1.8"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
      </svg>
    </div>

    <h2 class="title">Session Expired</h2>
    <p class="subtitle">
      Your session has timed out for security reasons.<br>
      Please log in again to continue.
    </p>

    <div class="countdown-ring">
      <svg viewBox="0 0 44 44">
        <circle class="track"  cx="22" cy="22" r="18" />
        <circle class="progress" cx="22" cy="22" r="18"
                [style.stroke-dashoffset]="113.1 - (113.1 * countdown / 10)" />
      </svg>
      <span class="countdown-number">{{ countdown }}</span>
    </div>

    <p class="redirect-note">Redirecting automatically in {{ countdown }}s</p>

    <button class="btn-login" (click)="goToLogin()">
      <span>Go to Login</span>
      <svg viewBox="0 0 20 20" fill="none">
        <path d="M4 10h12M11 5l5 5-5 5"
              stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  </div>
</div>
